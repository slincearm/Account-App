<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <script>
    (function () {
      var link = document.createElement('link');
      link.rel = 'manifest';
      // Check for Traditional Chinese (TW or HK)
      if (navigator.language === 'zh-TW' || navigator.language === 'zh-HK' || navigator.language === 'zh-Hant') {
        link.href = '/manifest_zh.json';
        document.title = "簡單記";
      } else {
        link.href = '/manifest.json';
        document.title = "SimpleTally";
      }
      document.head.appendChild(link);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleTally</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
